<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swapnil Shinde Portfolio</title>
<link rel="stylesheet" href="styles.css">
<script src="scripts.js" defer></script>
</head>
<body>

<div id="scale-wrapper">
    <div class="portfolio-hero-container">
        
        <!-- Fetched Navigation Bar Placeholder -->
        <div id="nav-placeholder"></div>

        <!-- Centered UI Window Area -->
        <div class="window-frame">
            <div class="window-header">
                <div class="window-dots">
                    <div class="dot dot-close"></div>
                    <div class="dot dot-min"></div>
                    <div class="dot dot-max"></div>
                </div>
            </div>
            
            <div class="window-content">
                <h1 class="headline">
                    I bridge the gap between complex business needs & <em>technical execution.</em>
                </h1>
                <div class="sub-details">
                    <div class="role-info">Senior Business Analyst at Trimble Inc.</div>
                    <div class="role-info" style="color: var(--text-grey); font-size: 14px;">Based in Cincinnati.</div>
                </div>
            </div>
        </div>

        <div class="scroll-arrow">
            <span class="material-icons">arrow_downward</span>
        </div>

    </div>
</div>

</body>
</html>
