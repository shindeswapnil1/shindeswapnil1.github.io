<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuneBot — AI Music Recommendation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="tunebot-styles.css">
</head>
<body>

<div class="app">
  <!-- Portfolio Integration Header -->
  <header class="portfolio-nav">
      <div class="nav-left">
          <a href="artifact1.html" target="_blank" class="back-link">
              <span class="material-icons">arrow_back</span> Back to AI Timeline
          </a>
      </div>
      <div class="nav-right">
          <span class="name">Swapnil S Shinde</span>
      </div>
  </header>

  <!-- TuneBot App Header -->
  <header class="app-header">
    <div class="logo">🎧</div>
    <div>
      <h1>TuneBot</h1>
      <p><span class="status-dot"></span>AI-powered music recommendation buddy</p>
    </div>
  </header>

  <!-- Chat Area -->
  <div id="chat"></div>

  <!-- Suggestion Chips -->
  <div class="chips" id="chips"></div>

  <!-- Input Bar -->
  <div class="input-bar">
    <input id="input" type="text" placeholder="Tell me a mood, genre, or artist…" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>

<script src="tunebot-scripts.js"></script>
</body>
</html>
